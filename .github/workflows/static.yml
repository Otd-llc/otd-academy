name: static

# The cheap, deterministic half of CI, split out so it can be a REQUIRED check.
#
# Why its own workflow file, not a job inside ci.yml: ci.yml declares
# `concurrency: ci-shared-test-db` at WORKFLOW scope, which a job cannot opt out
# of. Every run there queues single-file behind an ~11-minute build, and a
# pending run gets cancelled when a newer one arrives -- which is exactly what
# happened on #378, where CI was cancelled at 20s and nobody noticed because
# `guard` was the only required check. Requiring anything that lives inside that
# workflow would gate merges on infrastructure noise.
#
# Same reasoning as classification-guard.yml, which says so in its own header.
#
# Nothing here needs a database or a secret: `tsc` and `eslint` are static,
# `prisma validate` parses the schema without resolving the datasource URL, and
# the vitest step below runs vitest's "unit" project -- the half of the suite
# defined by NOT touching the real database. It gets stub env literals so `@/env`
# import-time validation passes; it resolves no real service. That is what makes
# it safe to require -- it cannot fail on a cold Neon branch, a playwright
# download, or a seed race.
#
# The heavy half (migrate, seed, next build, the diagram gate, and the 94 DB test
# files that need the shared ci-test branch) stays in ci.yml and stays advisory
# until its flaky steps get the retry treatment that `migrate` already has.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsc --noEmit
      # Ahead of nothing in particular now, but kept with the other static checks:
      # it needs no database and no secrets, so it gives the fastest feedback and
      # cannot be skipped by an earlier infrastructure failure. Register item A1
      # triaged the baseline to 0 errors; until it ran in CI, nothing stopped that
      # re-accumulating. `eslint .` exits non-zero on errors only, so the known
      # warnings stay visible without failing the run.
      - run: pnpm lint
      - run: pnpm prisma validate
      # ======================================================================
      # THE PRINT-INTENT PINS, IN A CHECK THAT ACTUALLY GATES A MERGE.
      # ======================================================================
      # These four files decide what is inside a file a customer downloads: the
      # single `PRINT_INTENT_TABLE` every print-facing surface reads, the bytes
      # `Metadata/model_settings.config` ends up carrying, the PrusaSlicer
      # payload, and the transcription that holds the academy against the
      # configurator's printed build sheet.
      #
      # They lived only in ci.yml's `build` job, which is NOT a required check on
      # main -- so an edit could turn four assertions red and still merge and
      # deploy with every required check green. Worse, ci.yml declares
      # `concurrency: ci-shared-test-db` at workflow scope, so a queued run gets
      # cancelled by a newer one and the red may never render at all (see #378).
      #
      # WHY THESE ARE SAFE TO REQUIRE, checked rather than assumed: not one
      # module in their import graph touches `@/env`, `@/lib/db` or prisma, so
      # they are all in vitest's "unit" project and lease no branch.
      # `vitest.setup.unit.ts` only calls `loadBaseEnv()`, which no-ops when the
      # env files are absent as they are here, and `vitest.global-setup.ts`
      # returns early with no `TEST_DATABASE_POOL`. No secret is referenced.
      #
      # `--project unit` is deliberate: if one of these ever starts importing the
      # real database it drops out of that project, and a file named explicitly
      # would stop matching. That property is kept below.
      #
      # ======================================================================
      # THE WHOLE UNIT PROJECT, NOT FOUR FILES.
      # ======================================================================
      # This step used to name those four print-intent files explicitly, on the
      # reasoning that `--project unit` with no paths "would pull in ~1900 tests
      # ... which is how a fast required check becomes a slow flaky one".
      #
      # That was never measured, and it is wrong. Measured on the full project,
      # under exactly the conditions this job provides -- stub env, no database,
      # no archive, CI=true:
      #
      #     Test Files  178 passed | 1 skipped (179)
      #     Tests       2142 passed | 3 skipped (2145)
      #     ~30s wall clock
      #
      # Thirty seconds, against a job that already spends longer in `tsc`. What
      # it buys: the required merge gate goes from 4 files / 101 test
      # declarations to 179 files / 2145 -- roughly 4% of the suite to all of the
      # half that needs no database. Everything advisory before this (every
      # server-action, authz, Stripe-webhook and schema test in the unit half)
      # now blocks a merge.
      #
      # The DB half (94 files) necessarily stays in ci.yml: it needs the shared
      # ci-test branch, which is what forces that workflow's concurrency group,
      # which is what makes anything inside it unsafe to require. That half is
      # still advisory. This closes the part that can be closed.
      #
      # The env below is STUB LITERALS, not secrets -- the same values ci.yml
      # already uses. They exist because `@/env` validates at import and some
      # unit files reach it transitively. Nothing here resolves a real service:
      # DATABASE_URL points at a hostname that does not exist, and no unit test
      # opens a connection (that is what puts them in this project). So the
      # property that makes this safe to require is intact -- it cannot fail on a
      # cold Neon branch, a seed race, or a missing secret.
      #
      # CONTENT_ARCHIVE_DIR is pointed at nothing on purpose: the content guards
      # scan a PRIVATE sibling repo that is absent here, and `test.runIf` skips
      # them rather than failing. Being explicit stops a future runner that
      # happens to have the archive from turning this into a content check.
      - name: unit suite (no DB, no secrets)
        run: pnpm vitest run --project unit
        env:
          DATABASE_URL: postgresql://stub:stub@stub/stub
          DIRECT_URL: postgresql://stub:stub@stub/stub
          AUTH_SECRET: "stub-secret-32-chars-long-padding-x"
          AUTH_GOOGLE_ID: stub
          AUTH_GOOGLE_SECRET: stub
          AUTH_GITHUB_ID: stub
          AUTH_GITHUB_SECRET: stub
          AUTH_RESEND_KEY: stub
          ALLOWED_EMAILS: "stub@stub"
          R2_ENABLED: "false"
          CONTENT_ARCHIVE_DIR: /nonexistent/content-archive
