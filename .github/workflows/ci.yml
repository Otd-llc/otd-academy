name: CI
on:
  pull_request:
  push:
    branches: [main]
# All runs share ONE persistent ci-test Neon branch, so concurrent runs race on
# the seeded fixtures (TransactionWriteConflict, drift). Serialize them: queue
# instead of cancelling so each run executes against the branch alone.
concurrency:
  group: ci-shared-test-db
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # tsc / lint / prisma validate moved to .github/workflows/static.yml so they
      # can be a REQUIRED check. They cannot be required from here: this workflow
      # declares `concurrency: ci-shared-test-db` at workflow scope, so every run
      # queues behind an ~11-minute build and a pending run is cancelled when a
      # newer one arrives. Do not add them back.
      # ORDER MATTERS: migrate + seed MUST run BEFORE `next build`.
      # The build now targets a REAL database (below), and under cacheComponents it
      # prerenders pages and evaluates `use cache` functions -- i.e. it runs Prisma
      # queries at build time. If the branch's schema were behind, the build would
      # fail with "column X does not exist" on perfectly correct code, pointing
      # nowhere near the real cause. This ordering was harmless while the build ran
      # against a stub URL; it is load-bearing now.
      # Keep the test branch's schema current as migrations are added (the branch
      # carries the seed + KiCad data, which CI can't regenerate). No-op when the
      # branch is already up to date.
      # The ci-test Neon compute auto-suspends when idle; the first connection
      # has to wake it, which can outrun a single migrate's connect timeout
      # (P1001). Retry so a cold branch wakes instead of failing the run.
      - name: Migrate the test DB (waking it if cold)
        run: |
          for i in 1 2 3 4 5 6; do
            pnpm exec prisma migrate deploy && exit 0
            echo "test DB not reachable yet (attempt $i) — waiting 10s…"
            sleep 10
          done
          echo "test DB still unreachable after retries" >&2
          exit 1
        env:
          DIRECT_URL: ${{ secrets.NEON_TEST_DIRECT_URL }}
      # Reset the seeded fixtures to a KNOWN state before tests. The ci-test
      # branch is shared + persistent, so earlier runs that advance demo data
      # (boards ASSEMBLED -> BROUGHT_UP, etc.) leave drift behind and break the
      # DB-backed smoke tests (load-gate-context, m8c-checkpoint). The seed is
      # idempotent (upserts; resets board status) and does NOT touch the branch's
      # KiCad lib data, so this restores the fixtures without regenerating them.
      # NOTE: the suite now isolates DB tests onto per-file branches when
      # TEST_DATABASE_POOL is set (vitest.env.ts); CI leaves it unset, so tests run
      # serially against this single ci-test branch — correct, just not parallel.
      - run: pnpm db:seed
        env:
          DATABASE_URL: ${{ secrets.NEON_TEST_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.NEON_TEST_DIRECT_URL }}
          AUTH_SECRET: "stub-secret-32-chars-long-padding-x"
          AUTH_GOOGLE_ID: stub
          AUTH_GOOGLE_SECRET: stub
          AUTH_GITHUB_ID: stub
          AUTH_GITHUB_SECRET: stub
          AUTH_RESEND_KEY: stub
          ALLOWED_EMAILS: "seed@example.com"
          R2_ENABLED: "false"
      - run: pnpm next build
        env:
          # A REAL database. With cacheComponents the build prerenders pages and
          # evaluates `use cache` functions, so it executes Prisma queries. The
          # stub only ever worked because every DB-backed page was force-dynamic
          # — which cacheComponents forbids. Same seeded ci-test branch the
          # vitest job uses (pooled URL for the client, direct for migrations).
          DATABASE_URL: ${{ secrets.NEON_TEST_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.NEON_TEST_DIRECT_URL }}
          AUTH_SECRET: "stub-secret-32-chars-long-padding-x"
          AUTH_GOOGLE_ID: stub
          AUTH_GOOGLE_SECRET: stub
          AUTH_GITHUB_ID: stub
          AUTH_GITHUB_SECRET: stub
          AUTH_RESEND_KEY: stub
          ALLOWED_EMAILS: "stub@stub"
          R2_ENABLED: "false"
      # Diagram export freshness gate: boot the production build, render every
      # registered guide diagram in headless Chromium, and fail if any is missing
      # its exported image or its alt text drifted from the committed manifest.
      # No DB needed (the render route is pure components) — runs on the stub env.
      # DIAGRAM_EXPORT=1 un-gates the prod-mode /diagram-render route. The check is
      # presence + alt only (pixel bytes differ across OS, so they're never compared).
      - name: Install Chromium for the diagram check
        run: pnpm exec playwright install --with-deps chromium
      - name: Diagram export freshness check
        run: |
          pnpm next start &
          APP_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/diagram-render/adc1-pin-map >/dev/null && break
            echo "waiting for app ($i)…"; sleep 2
          done
          pnpm diagrams:check; STATUS=$?
          kill "$APP_PID" 2>/dev/null || true
          exit $STATUS
        env:
          DATABASE_URL: postgresql://stub:stub@stub/stub
          DIRECT_URL: postgresql://stub:stub@stub/stub
          AUTH_SECRET: "stub-secret-32-chars-long-padding-x"
          AUTH_GOOGLE_ID: stub
          AUTH_GOOGLE_SECRET: stub
          AUTH_GITHUB_ID: stub
          AUTH_GITHUB_SECRET: stub
          AUTH_RESEND_KEY: stub
          ALLOWED_EMAILS: "stub@stub"
          R2_ENABLED: "false"
          DIAGRAM_EXPORT: "1"
          DIAGRAM_BASE_URL: http://localhost:3000
      - run: pnpm vitest run
        env:
          # DB-backed tests need a REAL seeded Postgres — these repo secrets point
          # at the seeded `ci-test` Neon branch (it inherits the schema + seed data).
          DATABASE_URL: ${{ secrets.NEON_TEST_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.NEON_TEST_DIRECT_URL }}
          # Non-DB env so `@/env` validation passes (mirrors the build step).
          AUTH_SECRET: "stub-secret-32-chars-long-padding-x"
          AUTH_GOOGLE_ID: stub
          AUTH_GOOGLE_SECRET: stub
          AUTH_GITHUB_ID: stub
          AUTH_GITHUB_SECRET: stub
          AUTH_RESEND_KEY: stub
          ALLOWED_EMAILS: "seed@example.com"
          R2_ENABLED: "false"

      # ======================================================================
      # THE R2-GATED SUITES, IN THEIR OWN RUN.
      # ======================================================================
      # A SEPARATE INVOCATION, NOT R2_ENABLED ON THE RUN ABOVE. The first cut set
      # the R2 env on the main step and 63 tests in printable-pack-route.test.ts
      # went red: it does its own `vi.stubEnv("R2_BUCKET", "test-bucket")` on the
      # assumption that the process has no real R2 config, and a real R2_BUCKET +
      # R2_ENDPOINT underneath it broke that. Roughly 180 files run in that step
      # and none of them asked for object storage; handing all of them a live S3
      # endpoint to reach seven is the wrong lever.
      #
      # Running second also keeps seven more DB-writing files out of the main
      # run's parallel set. They share ONE ci-test branch here (per-file branch
      # leasing needs TEST_DATABASE_POOL, which CI does not set), and the first
      # cut pushed it into `40001 could not serialize access` on files that had
      # nothing to do with this change.
      #
      # The file list must match `gatedBasenames` in vitest.config.ts. If they
      # drift, the banner in the step above names the file as excluded and it
      # simply does not run here -- visible, but nothing enforces it.
      - name: Start an S3-compatible server
        run: |
          set -euo pipefail
          docker run -d --name s3 -p 9000:9000 \
            -e MINIO_ROOT_USER=ciminio \
            -e MINIO_ROOT_PASSWORD=ciminio-secret \
            minio/minio:latest server /data
          # Poll rather than sleep: a fixed sleep is either wasted time or a flake.
          for i in $(seq 1 60); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null; then
              echo "minio ready after ${i}s"; break
            fi
            if [ "$i" = "60" ]; then
              echo "::error::minio never became ready"; docker logs s3; exit 1
            fi
            sleep 1
          done
          # Created with the SDK the app already depends on, rather than `mc` (not
          # guaranteed in the image) or the AWS CLI (a runner-image assumption).
          node -e '
            const { S3Client, CreateBucketCommand } = require("@aws-sdk/client-s3");
            const s3 = new S3Client({
              region: "auto",
              endpoint: "http://localhost:9000",
              forcePathStyle: true,
              credentials: { accessKeyId: "ciminio", secretAccessKey: "ciminio-secret" },
            });
            s3.send(new CreateBucketCommand({ Bucket: "otd-ci" }))
              .then(() => console.log("bucket otd-ci created"))
              .catch((e) => { console.error("::error::could not create bucket:", e.message); process.exit(1); });
          '
      - name: R2-gated suites (against the container)
        run: |
          FILES="src/lib/__tests__/artifact-render.test.ts
          src/lib/__tests__/kicad-export.test.ts
          src/lib/__tests__/m8b-checkpoint.test.ts
          src/lib/__tests__/part-assets-actions.test.ts
          src/lib/__tests__/part-assets-r2.test.ts
          src/lib/__tests__/uploads-actions.test.ts
          src/lib/__tests__/uploads-download.test.ts"

          # THE MCP FILE IS BOTH OPT-IN AND SELF-EXCLUDING, so it has to be added
          # here rather than listed above. Two separate mechanisms key off the same
          # variable and they disagree about the empty string:
          #
          #   * `@/env` types it `z.url().optional()`. Optional admits `undefined`,
          #     NOT "" -- and an unset GitHub secret interpolates to "". Passing it
          #     through as a plain `env:` key failed all seven files at import with
          #     `invalid_format ... PARTS_MCP_DATABASE_URL: Invalid URL`, before a
          #     single test ran. That is what this `if` prevents.
          #   * `MCP_OFF` in vitest.config.ts treats "" as absent and DROPS
          #     parts-mcp-readonly.test.ts from the file list. So naming it above
          #     unconditionally would fail with "No test files found" whenever the
          #     secret is missing -- and omitting it entirely would mean it never
          #     runs even once the role exists.
          #
          # Appending it only when the secret is real satisfies both.
          if [ -n "${PARTS_MCP_TEST_DATABASE_URL:-}" ]; then
            export PARTS_MCP_DATABASE_URL="$PARTS_MCP_TEST_DATABASE_URL"
            FILES="$FILES src/lib/__tests__/parts-mcp-readonly.test.ts"
          fi

          # Unquoted on purpose: the list must word-split into separate arguments.
          pnpm vitest run $FILES
        env:
          DATABASE_URL: ${{ secrets.NEON_TEST_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.NEON_TEST_DIRECT_URL }}
          AUTH_SECRET: "stub-secret-32-chars-long-padding-x"
          AUTH_GOOGLE_ID: stub
          AUTH_GOOGLE_SECRET: stub
          AUTH_GITHUB_ID: stub
          AUTH_GITHUB_SECRET: stub
          AUTH_RESEND_KEY: stub
          ALLOWED_EMAILS: "seed@example.com"
          # ON for this step ONLY. The build, seed and diagram steps above keep it
          # "false": they have no business reaching object storage, and flipping it
          # there would put the S3 container in the prerender path.
          #
          # These four values are LITERALS, not secrets. That is the entire point --
          # they name a container on this runner, so a fork PR gets exactly the same
          # coverage as a branch PR.
          R2_ENABLED: "true"
          R2_ENDPOINT: http://localhost:9000
          R2_BUCKET: otd-ci
          R2_ACCESS_KEY_ID: ciminio
          R2_SECRET_ACCESS_KEY: ciminio-secret
          # Unused once R2_ENDPOINT is set (s3Target ignores it), but @/env is
          # happier with it present and it documents that nothing here is real.
          R2_ACCOUNT_ID: ci-not-a-real-account
          # The eighth gated file, parts-mcp-readonly.test.ts, arms itself the
          # moment this secret exists and stays excluded until then (an unset
          # secret interpolates to "", which is falsy, which is exactly the
          # MCP_OFF condition in vitest.config.ts -- so this cannot fail a run).
          #
          # It needs a read-only role on the SEEDED ci-test branch, not a bare
          # container, and the reason is a trap worth naming: the test asserts an
          # `UPDATE "Part" ...` REJECTS. Against an empty database it rejects with
          # `relation "Part" does not exist` and the test passes for entirely the
          # wrong reason -- a read-only guarantee that has silently vanished would
          # still look green. The schema has to be real.
          #
          # PROVISIONING IS DOCUMENTED IN ONE PLACE: mcp/parts-server/README.md
          # section 6. Do not restate it here. The five statements that used to be
          # inlined at this spot OMITTED
          #
          #   ALTER DEFAULT PRIVILEGES FOR ROLE <owner> IN SCHEMA public
          #     GRANT SELECT ON TABLES TO foundry_ro;
          #
          # which is step 5 there and is the one that is easy to lose: without it
          # `GRANT SELECT ON ALL TABLES` covers only the tables that existed at the
          # moment it ran, so the role silently loses read access to every table a
          # later migration adds. The failure is invisible from here -- writes still
          # fail, so the cannot-write proof stays green while the server can no
          # longer read the new data.
          #
          # Then set the PARTS_MCP_TEST_DATABASE_URL repo secret to the role's URL.
          #
          # WHETHER TO DO THIS AT ALL is a real question, and the honest answer today
          # is probably not. `makeReadOnlyClient` adds nothing (`new PrismaClient({
          # adapter, log: [] })`), so this file tests a database ROLE's grants, not
          # code -- and a role CI provisions moments earlier is close to a tautology.
          # It would say nothing about PRODUCTION's foundry_ro, which is the one the
          # deployed server uses. The code-side risks are already covered and already
          # run here unexcluded: mcp/parts-server/__tests__/source-guards.test.ts
          # asserts no MCP module imports the read-write client and none writes to
          # stdout. No migration in this repo's history contains a GRANT, REVOKE,
          # ALTER ROLE or DEFAULT PRIVILEGES statement, so the grants do not drift on
          # their own. Left wired and unarmed deliberately.
          PARTS_MCP_TEST_DATABASE_URL: ${{ secrets.PARTS_MCP_TEST_DATABASE_URL }}
